description: NuGet (nuget.org) is operated by the .NET Foundation / Microsoft and is free to use. The
  V3 HTTP API is anonymous for read operations (download, search, metadata, catalog) and requires an X-NuGet-ApiKey
  for publish/delete (push). There is no commercial NuGet plan or pricing — paid functionality (private
  feeds, governance, SCA) is delivered through Azure Artifacts, GitHub Packages, or third parties (JFrog,
  Sonatype) rather than nuget.org itself.
sources:
  - https://learn.microsoft.com/en-us/nuget/api/overview
  - https://learn.microsoft.com/en-us/nuget/api/service-index
  - https://www.nuget.org/policies/Terms
plans:
  - id: nuget-public
    name: nuget.org Public Feed
    type: freemium
    description: Free anonymous read access to nuget.org. Free authenticated push for accounts with verified
      email. No commercial tier.
    entries:
      - label: Package read (download/metadata/search)
        name: read
        type: metered
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        domains:
          - https://api.nuget.org
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Package publish/unlist
        name: publish
        type: metered
        metric: publish
        limit: -1
        timeFrame: usage
        geo: global
        domains:
          - https://api.nuget.org
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: V3 service index (api.nuget.org/v3/index.json)
      - name: Anonymous read across PackageBaseAddress, RegistrationsBaseUrl, SearchQueryService
      - name: Authenticated push via X-NuGet-ApiKey
      - name: Symbol package upload
      - name: Catalog API (full event log)
      - name: NuGet Server API
      - name: NuGet Catalog API
      - name: NuGet Search API
      - name: NuGet Package Metadata API
      - name: NuGet Package Content API
