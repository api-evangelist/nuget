aid: nuget
name: NuGet
description: >-
  NuGet is the package manager for .NET, providing a centralized repository for developers to discover, share, and
  consume reusable code libraries. The NuGet developer platform exposes a set of HTTP APIs that enable programmatic
  access to package search, metadata retrieval, content download, catalog browsing, and package publishing against the
  nuget.org feed.
