apis:
- aid: nuget:nuget-catalog-api
  name: NuGet Catalog API
  description: >-
    The NuGet Catalog API is an append-only resource that records the full history of all package events
    on nuget.org, including packages being added, modified, listed, unlisted, and deleted. It provides
    a chronologically ordered log of every change to the package source, enabling consumers to build and
    maintain their own local copy of the entire set of packages available on nuget.org.
  humanURL: https://learn.microsoft.com/en-us/nuget/api/catalog-resource
  tags:
  - Package Management
  - .NET
  - Catalog
  - Event Log
  - Packages
  properties:
  - type: Documentation
    url: https://learn.microsoft.com/en-us/nuget/api/catalog-resource
  - type: OpenAPI
    url: openapi/nuget-catalog-api-openapi.yml
- aid: nuget:nuget-search-api
  name: NuGet Search API
  description: >-
    The NuGet Search API allows clients to query for packages available on a NuGet package source using
    the SearchQueryService resource found in the service index. It supports filtering by keyword, target
    framework, prerelease status, and package type, and returns paginated results with package metadata
    including versions, descriptions, download counts, and dependency information.
  humanURL: https://learn.microsoft.com/en-us/nuget/api/search-query-service-resource
  tags:
  - Package Management
  - .NET
  - Search
  - Discovery
  - Packages
  properties:
  - type: Documentation
    url: https://learn.microsoft.com/en-us/nuget/api/search-query-service-resource
  - type: OpenAPI
    url: openapi/nuget-search-api-openapi.yml
- aid: nuget:nuget-package-content-api
  name: NuGet Package Content API
  description: >-
    The NuGet Package Content API, accessed through the PackageBaseAddress resource, allows clients to
    download package content files (.nupkg) and package manifests (.nuspec) from a NuGet feed. It uses
    a flat container structure where packages are organized by lowercase package ID and version, providing
    direct access to the binary package files.
  humanURL: https://learn.microsoft.com/en-us/nuget/api/package-base-address-resource
  tags:
  - Package Management
  - .NET
  - Package Download
  - Content
  - NuPkg
  properties:
  - type: Documentation
    url: https://learn.microsoft.com/en-us/nuget/api/package-base-address-resource
  - type: OpenAPI
    url: openapi/nuget-package-content-api-openapi.yml
