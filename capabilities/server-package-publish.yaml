naftiko: 1.0.0-alpha2
info:
  label: NuGet Server API — Package Publish
  description: 'NuGet Server API — Package Publish. 3 operations. Lead operation: Push a package. Self-contained Naftiko capability
    covering one Nuget business surface.'
  tags:
  - Nuget
  - Package Publish
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    NUGET_API_KEY: NUGET_API_KEY
capability:
  consumes:
  - type: http
    namespace: server-package-publish
    baseUri: https://api.nuget.org/v3
    description: NuGet Server API — Package Publish business capability. Self-contained, no shared references.
    resources:
    - name: package
      path: /package
      operations:
      - name: pushpackage
        method: PUT
        description: Push a package
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: package-id-version
      path: /package/{id}/{version}
      operations:
      - name: deletepackage
        method: DELETE
        description: Delete or unlist a package
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: relistpackage
        method: POST
        description: Relist a package
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-NuGet-ApiKey
      value: '{{env.NUGET_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: server-package-publish-rest
    port: 8080
    description: REST adapter for NuGet Server API — Package Publish. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/package
      name: package
      description: REST surface for package.
      operations:
      - method: PUT
        name: pushpackage
        description: Push a package
        call: server-package-publish.pushpackage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/package/{id}/{version}
      name: package-id-version
      description: REST surface for package-id-version.
      operations:
      - method: DELETE
        name: deletepackage
        description: Delete or unlist a package
        call: server-package-publish.deletepackage
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: relistpackage
        description: Relist a package
        call: server-package-publish.relistpackage
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: server-package-publish-mcp
    port: 9090
    transport: http
    description: MCP adapter for NuGet Server API — Package Publish. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: push-package
      description: Push a package
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: server-package-publish.pushpackage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-unlist-package
      description: Delete or unlist a package
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: server-package-publish.deletepackage
      outputParameters:
      - type: object
        mapping: $.
    - name: relist-package
      description: Relist a package
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: server-package-publish.relistpackage
      outputParameters:
      - type: object
        mapping: $.
